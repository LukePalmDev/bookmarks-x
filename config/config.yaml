# ====================================================================
# Configurazione Bookmarks-X (Twitter Bookmark Sync & AI Analyzer)
# ====================================================================

engine: "claude" # Produzione: 'claude'. 'ollama' è locale e opzionale. 'gemini' resta disponibile.

x_account:
  cookie_source: "safari" # 'safari', 'auto', 'chrome', 'firefox', 'brave', 'edge' o 'env'
  batch_size: 20

claude:
  # ID pinnato verificato (non l'alias "sonnet"): Claude Sonnet 5.5.
  # https://code.claude.com/docs/en/model-config
  # https://docs.anthropic.com/en/docs/about-claude/models/overview
  # CLI >= 2.1.284. Sul mini: 2.1.317. Nessun --fallback-model.
  model: "claude-sonnet-5-5"
  effort: "high"
  # Orario riportato per il reset settimanale di questo account, non un default Anthropic.
  weekly_reset_time: "06:00"
  weekly_reset_tz: "Europe/Rome"

# Motore locale opzionale. Non è attivo finché `engine` resta "claude".
# Tag verificato sul Mac mini (Ollama 0.40.14, già installato, nessun download):
# gemma4:12b-it-q4_K_M. La qualità bookmarks non è la accuracy del classificatore Trader.
ollama:
  model: "gemma4:12b-it-q4_K_M"
  base_url: "http://127.0.0.1:11434"
  timeout_seconds: 120
  max_attempts: 2
  # Tetto misurato: num_ctx 4096 porta la RAM libera circa al 14% su 16GB.
  # Il massimo di contesto del modello (262144) non va usato. Il client lo serra a 4096.
  num_ctx: 4096
  num_predict: 512
  max_input_chars: 2000
  temperature: 0
  # ThinkValue dell'API chat accetta boolean. Il modello tiene il thinking acceso
  # di default; false basta per questa estrazione e evita token extra in 4096.
  think: false
  # Un solo post per ciclo: Trader usa lo stesso Ollama e lo stesso modello.
  max_per_cycle: 1

gemini:
  model: "gemini-3.5-flash"
  temperature: 0.2
  max_output_tokens: 2048

sync:
  interval_seconds: 300 # Controllo ogni 5 minuti
  download_media: true
  export_markdown: true

storage:
  database_path: "data/bookmarks.db"
  media_dir: "data/media"
  archive_dir: "data/archive"
  logs_dir: "logs"

analysis:
  language: "it"
  mode: "basic" # Attualmente Autore e Titolo sintetico

telegram:
  enabled: true
  bot_name: "bookmarks-x"
  send_photos: true
  notify_on_new_bookmark: true
